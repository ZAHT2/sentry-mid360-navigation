chassis_bridge_node:
  ros__parameters:
    serial_port: /dev/ttyABoard
    baudrate: 115200
    cmd_vel_topic: /cmd_vel
    odom_topic: /chassis/odom_raw
    odom_frame: chassis_odom
    base_frame: base_footprint
    publish_odom: true
    publish_tf: false
    write_rate_hz: 50.0
    read_timeout_ms: 2
    cmd_timeout_sec: 0.5
    # ROS/Nav2: x forward, y left. Current chassis protocol comments:
    # x right, y forward. Map ROS command into chassis command here.
    cmd_vx_from_ros_x: 0.0
    cmd_vx_from_ros_y: -1.0
    cmd_vy_from_ros_x: 1.0
    cmd_vy_from_ros_y: 0.0
    cmd_wz_scale: 1.0
